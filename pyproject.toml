[project]
name = "openchronicle"
version = "0.1.0"
description = "Local-first screen-context memory for any LLM agent. Captures AX Tree + screenshots, exposes the result via MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenChronicle contributors" }]
keywords = ["mcp", "memory", "context", "accessibility", "ax-tree", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "litellm>=1.52",
    # LiteLLM's tool-call response path imports proxy helpers even when its
    # optional proxy server is not used. Classifier requests always use tools.
    "fastapi>=0.136.3,<1.0",
    "orjson>=3.11.6,<4.0",
    "python-frontmatter>=1.1",
    "mss>=9.0",
    "Pillow>=10.0",
    "mcp>=1.0",
    "httpx[socks]>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
openchronicle = "openchronicle.cli:app"

[project.urls]
Repository = "https://github.com/openchronicle/openchronicle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openchronicle"]

[tool.hatch.build.targets.wheel.force-include]
"resources/mac-ax-helper.swift" = "openchronicle/_bundled/mac-ax-helper.swift"
"resources/build-mac-ax-helper.sh" = "openchronicle/_bundled/build-mac-ax-helper.sh"
"resources/mac-ax-watcher.swift" = "openchronicle/_bundled/mac-ax-watcher.swift"
"resources/build-mac-ax-watcher.sh" = "openchronicle/_bundled/build-mac-ax-watcher.sh"
"resources/mac-window-list.swift" = "openchronicle/_bundled/mac-window-list.swift"
"resources/mac-window-list-core.swift" = "openchronicle/_bundled/mac-window-list-core.swift"
"resources/build-mac-window-list.sh" = "openchronicle/_bundled/build-mac-window-list.sh"
"resources/mac-privacy-overlay-core.swift" = "openchronicle/_bundled/mac-privacy-overlay-core.swift"
"resources/mac-privacy-overlay-reason.swift" = "openchronicle/_bundled/mac-privacy-overlay-reason.swift"
"resources/mac-privacy-overlay.swift" = "openchronicle/_bundled/mac-privacy-overlay.swift"
"resources/mac-privacy-overlay-Info.plist" = "openchronicle/_bundled/mac-privacy-overlay-Info.plist"
"resources/build-mac-privacy-overlay.sh" = "openchronicle/_bundled/build-mac-privacy-overlay.sh"
"resources/mac-screen-capture-core.swift" = "openchronicle/_bundled/mac-screen-capture-core.swift"
"resources/mac-screen-capture.swift" = "openchronicle/_bundled/mac-screen-capture.swift"
"resources/build-mac-screen-capture.sh" = "openchronicle/_bundled/build-mac-screen-capture.sh"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.build",
    "/macos/OpenChronicleApp/.build",
    "/resources/mac-window-list",
    "/resources/mac-privacy-overlay",
    "/resources/OpenChroniclePrivacyOverlay.app",
    "/resources/mac-screen-capture",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
